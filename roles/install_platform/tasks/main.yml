---
#  vars:
#    volttron_source_changed: no

- name: update pip in venv {{ volttron_venv }}
  pip:
    virtualenv: "{{ volttron_venv }}"
    virtualenv_command: "{{ python_interpreter }} -m venv"
    ## We add setuptools here because the module needs at
    ## a non-empty target list to avoid warnings and report
    ## change status correctly. The updates are separated because
    ## they fail when they are listed together. Probably an
    ## ordering thing.
    name:
    - pip>18.1
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ http_proxy }}"

- name: install the VOLTTRON platform
  pip:
    virtualenv: "{{ volttron_venv }}"
    virtualenv_command: "{{ python_interpreter }} -m venv"
    name:
      - volttron-core>=2.0.0rc13 
      - volttron-lib-zmq
      - volttron-lib-auth>=2.0.0rc3
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ http_proxy }}"

- name: install VOLTTRON web packages
  pip:
    virtualenv: "{{ volttron_venv }}"
    virtualenv_command: "{{ python_interpreter }} -m venv"
    name: "{{ web_packages }}"
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ http_proxy }}"
  when: web_enabled | bool

- name: create environment activation script
  template:
    src: activate-instance-env.j2
    dest: "{{ ansible_env.HOME }}/activate-{{ instance_name }}-env"

- name: create start-volttron script
  template:
    src: start-volttron.j2
    dest: "{{ volttron_venv }}/bin/start-volttron"
    mode: 0755

- name: create volttron service file
  template:
    src: volttron-service.j2
    dest: "/etc/systemd/system/volttron-{{ instance_name }}.service"
    owner: root
    group: root
  become: true
  become_user: root

# Daemon reload
- name: force reload of services to pick up volttron service
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# enable service
- name: enable volttron service
  ansible.builtin.systemd_service:
    name: "volttron-{{instance_name}}"
    enabled: true
  become: true

# configure the platform
- name: ensure VOLTTRON_HOME exists
  file:
    path: "{{ volttron_home }}"
    state: directory
    mode: 0755
- name: set instance name
  ini_file:
    path: "{{ volttron_home }}/config"
    section: volttron
    option: instance-name
    value: "{{ instance_name }}"
    mode: '0600'
    backup: yes
- name: set message bus
  ini_file:
    path: "{{ volttron_home }}/config"
    section: volttron
    option: messagebus
    value: "{{ messagebus }}"
    mode: '0600'
    backup: yes
- name: ensure platform configuration
  loop: "{{ host_configuration.config | dict2items | rejectattr('key', 'in', web_config_keys) | list }}"
  ini_file:
    path: "{{ volttron_home }}/config"
    section: volttron
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: '0600'
    backup: yes

- name: read existing web secret key
  command: >-
    {{ volttron_venv }}/bin/python -c
    "from configparser import ConfigParser; from pathlib import Path; c=ConfigParser(); c.read(Path('{{ volttron_home }}') / 'config'); print(c.get('web', 'web-secret-key', fallback=''))"
  register: existing_web_secret_key
  changed_when: false
  failed_when: false
  when: web_enabled | bool
  no_log: true

- name: choose web secret key
  set_fact:
    effective_web_secret_key: "{{ web_secret_key if (web_secret_key | length > 0) else ((existing_web_secret_key.stdout | default('')) if (existing_web_secret_key.stdout | default('') | length > 0) else lookup('password', '/dev/null length=43 chars=ascii_letters,digits')) }}"
  when: web_enabled | bool
  no_log: true

- name: configure web bind address
  ini_file:
    path: "{{ volttron_home }}/config"
    section: web
    option: bind-web-address
    value: "{{ web_bind_address }}"
    mode: '0600'
    backup: yes
  when: web_enabled | bool

- name: configure web secret key
  ini_file:
    path: "{{ volttron_home }}/config"
    section: web
    option: web-secret-key
    value: "{{ effective_web_secret_key }}"
    mode: '0600'
    backup: yes
  when: web_enabled | bool
  no_log: true

- name: copy web user setup script
  template:
    src: setup-web-user.py.j2
    dest: "{{ volttron_home }}/setup-web-user.py"
    mode: '0600'
  changed_when: false
  when:
  - web_enabled | bool
  - web_admin_user | length > 0
  - web_admin_password | length > 0

- name: create web admin user
  command: "{{ volttron_venv }}/bin/python {{ volttron_home }}/setup-web-user.py"
  environment:
    VOLTTRON_HOME: "{{ volttron_home }}"
    VOLTTRON_WEB_ADMIN_USER: "{{ web_admin_user }}"
    VOLTTRON_WEB_ADMIN_PASSWORD: "{{ web_admin_password }}"
    VOLTTRON_WEB_ADMIN_GROUPS: "{{ web_admin_groups | to_json }}"
  register: web_admin_user_result
  changed_when: "web_admin_user_result.stdout | trim == 'CHANGED'"
  when:
  - web_enabled | bool
  - web_admin_user | length > 0
  - web_admin_password | length > 0
  no_log: true

- name: remove web user setup script
  file:
    path: "{{ volttron_home }}/setup-web-user.py"
    state: absent
  changed_when: false
  when:
  - web_enabled | bool
  - web_admin_user | length > 0
  - web_admin_password | length > 0

# For RMQ, do the extra config/bootstrapping/cert generation
- name: rabbitmq configuration
  when: messagebus == "rmq"
  block:
  - name: create rabbitmq config
    template:
      src: rabbitmq_config.yml.j2
      dest: "{{ volttron_home }}/rabbitmq_config.yml"

  - name: run vcfg to configure for RMQ
    ##NOTE: note that this task will always report changes and will replace and recreate the rmq confg (even if no changes)
    ##      this is not great design generally, and violates idempotent expectations in ansible. For now we roll with it.
    expect:
      command: "{{ volttron_venv }}/bin/vcfg --vhome {{ volttron_home }} --instance-name {{ instance_name }} --rabbitmq single {{ volttron_home }}/rabbitmq_config.yml"
      responses:
        '.*Remove [a-zA-Z1-9_\-./]*/rabbitmq.conf?.*': 'y'
        '.*Do you want to use this certificate.*': ''
      timeout: 90
    register: vcfg_result
    ignore_errors: "{{verbose_debug_tasks | bool}}"
  - fail:
      msg: "vcfg failed because the instance is running, you must stop it (perhaps with the volttron.deployment.run_platform role)"
    when: '"The current instance is running" in vcfg_result.stdout'
  - name: debug print of vcfg results
    when: verbose_debug_tasks | bool
    debug:
      msg: "{{ vcfg_result }}"
    failed_when: vcfg_result.failed
